# Faithful end-to-end test: real node-tlcv watching a uci-to-tlcs broadcast.
#
# Why two containers? node-tlcv binds the broadcast port on 0.0.0.0 (wildcard) and
# the server also listens on that port — they cannot share a port on one host. Two
# containers each get their own IP and bind the port on their own stack, exactly
# like production. node-tlcv reaches the server by service name.
#
# Setup:
#   1. Have node-tlcv checked out next to this repo (../node-tlcv) or adjust the
#      build context / image below.
#   2. Create ./e2e/config.json (see README) pointing at uci-to-tlcs:16066.
#   3. docker compose -f docker-compose.test.yml up --build
#   4. Open http://localhost:8080/ and watch the broadcast.

services:
  uci-to-tlcs:
    build:
      context: .
      dockerfile: Dockerfile
    # serves fixtures/sample-game.uci on UDP 16066 (see Dockerfile CMD)
    networks:
      - tlcs

  node-tlcv:
    build:
      context: ../node-tlcv
    depends_on:
      - uci-to-tlcs
    environment:
      - PORT=8080
      - TLCV_PASSWORD=test
      - LOG_LEVEL=info
    ports:
      - "8080:8080"
    volumes:
      # config.json must contain: { "connections": ["uci-to-tlcs:16066"] }
      - ./e2e/config.json:/app/config/config.json:ro
    networks:
      - tlcs

networks:
  tlcs:
    driver: bridge
